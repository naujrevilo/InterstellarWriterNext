[package]
name = "interstellar-writer-next"
version = "0.1.0"
edition = "2021"

[lib]
name = "interstellar_writer_next_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
walkdir = "2"
tempfile = "3"
base64 = "0.22"
git2 = { version = "0.20", features = ["vendored-libgit2"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[dev-dependencies]
tempfile = "3"
